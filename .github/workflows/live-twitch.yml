name: Live Twitch diagnostics
on:
  workflow_dispatch:
    inputs:
      channels:
        description: Up to three comma-separated channel logins
        default: stariy_bog,madarapoe
        required: true
  push:
    branches: [feature/chrome-mv3]
    paths:
      - tests/live-twitch.cjs
      - .github/workflows/live-twitch.yml

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Inspect live playback in a disposable browser
        env:
          WEAVE_LIVE_CHANNELS: ${{ inputs.channels || 'stariy_bog,madarapoe' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/weave-browser-tests" --no-package-lock --no-audit --no-fund playwright@1.62.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/weave-browser-tests/node_modules/playwright"
          "$PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
          export CHROMIUM_PATH="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          node tests/live-twitch.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: live-twitch-diagnostics
          path: dist/live-twitch/
          if-no-files-found: warn
          retention-days: 7
