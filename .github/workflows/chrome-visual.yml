name: Inspect Chrome player controls
on:
  push:
    branches: [experiment/chrome-player-visual]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/weave-visual" --no-package-lock --no-audit --no-fund playwright@1.62.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/weave-visual/node_modules/playwright"
          "$PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
          mkdir visual
          node tests/chrome-visual.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f3752f3646cd9
        if: always()
        with:
          name: player-visuals
          path: visual
