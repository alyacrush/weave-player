name: Chrome live playback smoke test
on:
  push:
    branches: [experiment/chrome-live-smoke]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/weave-live" --no-package-lock --no-audit --no-fund playwright@1.62.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/weave-live/node_modules/playwright"
          "$PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium
          python3 -m zipfile -e "$(python3 scripts/build_chrome.py)" "$RUNNER_TEMP/extension"
          node tests/chrome-live.cjs "$RUNNER_TEMP/extension"
